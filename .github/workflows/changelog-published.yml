name: Changelog published

# When changelog entries land on main, label their Trello cards "In changelog"
# so they are never collected twice.
#
# Secrets: TRELLO_KEY, TRELLO_TOKEN

on:
  push:
    branches: [main]
    paths: [src/content/changelog.json]

permissions:
  contents: read

jobs:
  mark-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/changelog/mark-published.mjs
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD: WVkpUiQo
